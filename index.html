<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Scheduler</title>
<style>
:root{box-sizing:border-box;--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#5d6b82;--pri:#002e5d;--on:#fff;--acc:#e8eef8;--line:#d5dbe6;--urg:#c62828;--std:#d98200;--flx:#2e7d32;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0d1320;--card:#182236;--ink:#eaf0fb;--mut:#9aa8c2;--pri:#6fa3ef;--on:#0d1320;--acc:#223250;--line:#2c3b58}
[data-theme=forest]{--pri:#1b5e3a;--acc:#e3f1e8;--bg:#eef3ef}
[data-theme=plum]{--pri:#6a1b6e;--acc:#f1e5f2;--bg:#f4eef5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--card);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main";height:100vh;background:var(--card)}
.top{grid-area:top;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:22px;text-align:center}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--pri);font-size:16px;font-weight:700;border:0;cursor:pointer;overflow:hidden}
.ic img,.av img{width:100%;height:100%;object-fit:cover}
.main{grid-area:main;overflow:auto;min-height:0;padding:24px 24px 100px;padding-inline:max(24px,calc((100% - 1200px)/2))}
#app[data-page=add] .main,#app[data-page=settings] .main,#app[data-page=profile] .main{padding-inline:max(24px,calc((100% - 640px)/2))}
#app[data-page=todo] .main,#app[data-page=discovery] .main,#app[data-page=summary] .main{padding-inline:max(24px,calc((100% - 820px)/2))}
#app .login{grid-column:1/-1;grid-row:1/-1;width:100%;max-width:420px;margin:auto;padding:24px;overflow:visible}
.nav{grid-area:nav;display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-right:1px solid var(--line)}
.nav a{padding:12px 16px;border-radius:10px;font-size:15px;color:var(--mut);font-weight:600}.nav a:hover{background:var(--bg)}
.nav a.on{color:var(--pri);background:var(--acc)}
.fab{position:fixed;right:32px;bottom:28px;height:52px;padding:0 24px;border:0;border-radius:99px;background:var(--pri);color:var(--on);font:600 16px system-ui;cursor:pointer;box-shadow:0 4px 12px #0004}
.seg{max-width:360px;display:flex;background:var(--acc);border-radius:10px;padding:3px;margin:2px 0 8px}
.seg a{flex:1;text-align:center;padding:6px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mut)}
.seg a.on{background:var(--pri);color:var(--on)}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--pri);color:var(--on);font:600 15px system-ui;text-align:center;margin-top:10px;cursor:pointer}
.btn.alt{background:var(--acc);color:var(--pri)}.btn.del{background:var(--urg);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:10px 0 3px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:18px;height:18px;flex:none}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--bg);border-radius:12px;margin-bottom:6px;cursor:pointer}
.row .t{flex:1;min-width:0}.row small{display:block;color:var(--mut)}.done .t{text-decoration:line-through;opacity:.5}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.p1{color:var(--urg)}.p2{color:var(--std)}.p3{color:var(--flx)}
.nav2{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.nav2 button{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:var(--pri);font-size:18px;cursor:pointer}
.add{padding:5px 12px;border:0;border-radius:99px;background:var(--pri);color:var(--on);font-size:12px;font-weight:700;cursor:pointer}
.add:disabled{opacity:.5}
.dg{display:grid;grid-template-columns:1fr 280px;gap:24px}
.grid{position:relative;height:816px}
.grid i{position:absolute;left:0;right:0;border-top:1px solid var(--line);font:normal 10px system-ui;color:var(--mut);height:48px}
.ev{font-size:14px;position:absolute;left:54px;right:2px;padding:3px 7px;border-radius:8px;color:#fff;font-size:12px;font-weight:600;overflow:hidden;cursor:pointer}
.sug{position:absolute;left:54px;right:2px;height:44px;padding:4px 7px;border:1.5px dashed var(--pri);border-radius:8px;font-size:11px;color:var(--pri);background:var(--card)}
.sug button{float:right;margin-top:-2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:13px}
.wk>div{background:var(--bg);border-radius:8px;min-height:480px;padding:8px;display:flex;flex-direction:column;gap:5px}
.wk>div>b{text-align:center;font-size:14px;cursor:pointer}.wk .td{outline:2px solid var(--pri)}
.wk span{border-radius:6px;padding:4px 6px;overflow:hidden;cursor:pointer;color:#fff;font-weight:600;word-break:break-word}
.wk hr{width:100%;border:0;border-top:1px solid var(--line);margin:1px 0}
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.mo>b{font-size:11px;color:var(--mut)}
.mo>div{min-height:104px;background:var(--bg);border-radius:10px;padding:6px;font-size:14px;font-weight:600;overflow:hidden;cursor:pointer}.mo .td{outline:2px solid var(--pri)}.mo .x{opacity:.4}
.mo u{display:block;text-decoration:none;color:#fff;font-size:11px;font-weight:600;text-align:left;padding:2px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw select{width:120px}
.tog{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--pri)}.tog.on::after{left:23px}
.av{width:88px;height:88px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:36px;color:var(--pri);margin:6px auto;overflow:hidden;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--mut);font-weight:600}
.chips{max-width:420px;display:flex;gap:6px;margin:8px 0}.chips button{flex:1;padding:7px 2px;border:0;border-radius:10px;background:var(--acc);color:var(--pri);font:600 12px system-ui;cursor:pointer}.chips .on{background:var(--pri);color:var(--on)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px;padding:18px 20px 22px;box-shadow:0 20px 50px #0005}
.sheet header{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0}
.rem{background:var(--acc);border-radius:12px;padding:8px 12px;margin-bottom:6px;color:var(--pri);font-size:13px;font-weight:600}
.err{color:var(--urg);font-size:13px;min-height:18px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2433;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;white-space:nowrap}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-areas:"top" "main" "nav"}.nav{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px}.nav a{flex:1;text-align:center;padding:10px 4px;font-size:13px}.fab{bottom:76px;right:16px}.dg{grid-template-columns:1fr}.top{padding:10px 12px}.wk{font-size:10px;gap:3px}.wk>div{padding:3px;min-height:340px}.mo>div{min-height:60px;font-size:12px}.mo u{height:5px;font-size:0;padding:0}}#toast.s{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   SUPABASE SETUP  (the only thing you need to edit)
   1. Supabase dashboard > Project Settings > API
   2. Paste the Project URL and the anon/public key between the quotes.
   Leave both empty to run in DEMO MODE (data saved in this browser only).
   ===================================================================== */
const SUPABASE_URL='https://hgrkoiexrsmnasgmbstk.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_jQ9j5hYfRFP6ATHftGyu2Q_g5rzId05';
/* ===================================================================== */
const useSB=!!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);
if(SUPABASE_URL&&!window.supabase)console.error('Supabase library failed to load; running in demo mode.');
let DEMO=false;
const live=()=>useSB&&!DEMO;
const sb=useSB?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}}):null;
const $=s=>document.querySelector(s);
const T={school:['School','#3f6fd1'],work:['Work','#8e44ad'],church:['Church','#c2185b'],social:['Social','#d98200'],personal:['Personal','#1a9c8a'],career:['Career','#00838f']};
const PS={1:'!!!',2:'!!',3:'!'},PN={1:'Urgent',2:'Standard',3:'Flexible'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const ad=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const L=(s,o)=>pd(s).toLocaleDateString('en-US',o);
const t12=t=>{const[h,m]=t.split(':');return(h%12||12)+(m!=='00'?':'+m:'')+(h<12?' am':' pm')};
const mins=t=>{const[h,m]=t.split(':');return h*60+ +m};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=iso(new Date());
let D=TODAY,E=null,AK='task',DR=null,PE=false,LM='in',F='all',Q='';
const init=()=>({uid:null,interests:[],accounts:{},user:null,stay:false,items:[],linked:{},photo:'',set:{notif:true,view:'day',wk:1,theme:'royal',sug:true},prof:{name:'',school:'BYU',work:'',age:'',gender:''}});
let S;if(useSB)S=init();else{try{S=JSON.parse(localStorage.getItem('sch2'))||init()}catch(e){S=init()}if(!S.stay)S.user=null}
if(!S.interests)S.interests=['career','ai'];
const save=()=>{if(useSB||DEMO)return;try{localStorage.setItem('sch2',JSON.stringify(S))}catch(e){}};
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)});

/* ============ DATA LAYER: every Supabase call lives here ============
   Table/column names below follow your ERD. At startup the app checks them against
   your real Supabase tables and adapts to upper/lower-case differences automatically. */
const ERD={
 users:{t:'User',id:'User_ID',name:'Name',pass:'Password',school:'School',work:'Work',age:'Age',gender:'Gender'},
 settings:{t:'Settings',uid:'User_ID',view:'Default_View',week:'Week_Start_Day',theme:'Theme_Choice',sug:'AI_Suggestion'},
 interests:{t:'Interests',uid:'User_ID',val:'Interests'},
 tasks:{t:'Tasks',id:'Task_ID',uid:'User_ID',title:'Task_Title',date:'Date',type:'Type',pri:'Priority',desc:'Description',rep:'Is_Repeatable'},
 todo:{t:'To-Do',id:'Task_ID',done:'Is_Complete'},
 events:{t:'Events',id:'Event_ID',uid:'User_ID',title:'Event_Title',date:'Date',start:'Start_Time',end:'End_Time',loc:'Location',type:'Type',pri:'Priority',desc:'Description',rep:'Is_Repeatable'}};
const OPT=['school','work','age','gender','rep'];
let M=null,DBERR=[];
const nice=e=>{const m=e.message||String(e);return /row-level security/i.test(m)?'Supabase is blocking this table (Row Level Security). Run setup.sql once in the Supabase SQL Editor.':/null value in column/i.test(m)?'An ID column is not auto-numbering: '+m:m};
const fail=e=>{console.error(e);toast('Could not save: '+nice(e))};
const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
async function hashPw(u,p){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}return'plain:'+p}
const tt=v=>v?String(v).slice(11,16):'';
const dd=v=>v?String(v).slice(0,10):'';
const ty=v=>T[v]?v:'personal';
const tcand=n=>{const a=[n,n.toLowerCase(),n.replace(/-/g,'_'),n.replace(/-/g,'_').toLowerCase(),n.replace(/-/g,'').toLowerCase()];return[...new Set([...a,...a.map(x=>x+'s')])]};
const ccand=c=>[...new Set([c,c.toLowerCase(),c.replace(/_/g,' ')])];
const qc=c=>/^[A-Za-z0-9_]+$/.test(c)?c:'"'+c+'"';
const scol=(...c)=>c.map(qc).join(',');
const mk=(k,o)=>{const r={};for(const[f,v]of Object.entries(o))if(M[k][f])r[M[k][f]]=v;return r};
async function resolveTable(def){let why='';
 for(const tn of tcand(def.t)){const names=Object.entries(def).filter(([f])=>f!='t');
  const all=await sb.from(tn).select(scol(...names.map(n=>n[1]))).limit(0);
  if(!all.error)return{map:{...Object.fromEntries(names),t:tn},miss:[]};
  const c=all.error.code;
  if(c=='PGRST205'||c=='42P01'){why=all.error.message;continue}
  if(c!='42703')return{map:null,why:all.error.message};
  const map={t:tn},miss=[];
  await Promise.all(names.map(async([f,c0])=>{for(const cn of ccand(c0)){const r=await sb.from(tn).select(qc(cn)).limit(0);if(!r.error){map[f]=cn;return}}if(!OPT.includes(f))miss.push(c0)}));
  return{map,miss}}
 return{map:null,why:why||'not found'}}
async function resolveSchema(){const out={},probs=[];
 await Promise.all(Object.entries(ERD).map(async([k,def])=>{const r=await resolveTable(def);
  if(!r.map)probs.push('Table "'+def.t+'" is not usable ('+r.why+')');
  else{out[k]=r.map;if(r.miss.length)probs.push('Table "'+r.map.t+'" needs column(s): '+r.miss.join(', '))}}));
 M=out;DBERR=probs}
async function dbItem(it){if(!live())return;
 try{if(it._p)await it._p;
  it._p=(async()=>{const task=it.kind=='task',B=M[task?'tasks':'events'],ts=t=>t?it.date+'T'+t+':00':null;
   const row=task?mk('tasks',{uid:S.uid,title:it.title,date:it.date,type:it.type,pri:String(it.pri),desc:it.desc||'',rep:false})
    :mk('events',{uid:S.uid,title:it.title,date:it.date,start:ts(it.time),end:ts(it.end),loc:it.loc||'',type:it.type,pri:+it.pri,desc:it.desc||'',rep:false});
   if(!it.rid){const r=await q(sb.from(B.t).insert(row).select(qc(B.id)).single());it.rid=r[B.id]}
   else await q(sb.from(B.t).update(row).eq(B.id,it.rid));
   if(task){const TD=M.todo,r2=await q(sb.from(TD.t).update({[TD.done]:!!it.done}).eq(TD.id,it.rid).select());
    if(!r2.length)await q(sb.from(TD.t).insert(mk('todo',{id:it.rid,done:!!it.done})))}})();
  await it._p}catch(e){fail(e)}}
async function dbDel(it){if(!live())return;try{if(it._p)await it._p;if(!it.rid)return;const B=M[it.kind=='task'?'tasks':'events'];
 if(it.kind=='task')await q(sb.from(M.todo.t).delete().eq(M.todo.id,it.rid));
 await q(sb.from(B.t).delete().eq(B.id,it.rid))}catch(e){fail(e)}}
async function dbSettings(){if(!live())return;try{localStorage.setItem('sch_notif_'+S.uid,S.set.notif?'1':'0');
 const B=M.settings,row=mk('settings',{view:S.set.view,week:+S.set.wk==0?'Sunday':'Monday',theme:S.set.theme,sug:!!S.set.sug});
 const r=await q(sb.from(B.t).update(row).eq(B.uid,S.uid).select());if(!r.length)await q(sb.from(B.t).insert({...row,[B.uid]:S.uid}))}catch(e){fail(e)}}
async function dbProfile(np,ints){if(!live())return true;try{const U=M.users;
 if(np.name!==S.prof.name){const x=await q(sb.from(U.t).select(qc(U.id)).eq(U.name,np.name).neq(U.id,S.uid).limit(1));if(x.length)throw new Error('That name is already taken.')}
 const a=parseInt(np.age);
 await q(sb.from(U.t).update(mk('users',{name:np.name,school:np.school,work:np.work,age:isNaN(a)?null:a,gender:np.gender})).eq(U.id,S.uid));
 const I=M.interests;await q(sb.from(I.t).delete().eq(I.uid,S.uid));
 if(ints.length)await q(sb.from(I.t).insert(ints.map(v=>mk('interests',{uid:S.uid,val:v}))));
 S.user=np.name;return true}catch(e){fail(e);return false}}
const lsPhoto=()=>{if(live())try{localStorage.setItem('sch_photo_'+S.uid,S.photo)}catch(e){}};
function dbLink(k,on){if(!live())return;try{localStorage.setItem('sch_linked_'+S.uid,JSON.stringify(S.linked))}catch(e){}}
async function loadSB(){const id=S.uid,MU=M.users,MS=M.settings,MI=M.interests,MT=M.tasks,ME=M.events,MD=M.todo;
 const[u,se,ints,ts,es]=await Promise.all([q(sb.from(MU.t).select('*').eq(MU.id,id).limit(1)),q(sb.from(MS.t).select('*').eq(MS.uid,id).limit(1)),q(sb.from(MI.t).select('*').eq(MI.uid,id)),q(sb.from(MT.t).select('*').eq(MT.uid,id)),q(sb.from(ME.t).select('*').eq(ME.uid,id))]);
 const tds=ts.length?await q(sb.from(MD.t).select('*').in(MD.id,ts.map(r=>r[MT.id]))):[];
 const done={};tds.forEach(r=>done[r[MD.id]]=!!r[MD.done]);
 const p=u[0]||{},s0=se[0],g=k=>{try{return localStorage.getItem(k+id)}catch(e){return null}};
 S.prof={name:p[MU.name]||S.user,school:p[MU.school]||'',work:p[MU.work]||'',age:p[MU.age]==null?'':String(p[MU.age]),gender:p[MU.gender]||''};
 S.photo=g('sch_photo_')||'';try{S.linked=JSON.parse(g('sch_linked_')||'{}')}catch(e){S.linked={}}
 S.set={notif:g('sch_notif_')!=='0',view:s0?String(s0[MS.view]||'day').toLowerCase():'day',wk:s0&&/^sun/i.test(s0[MS.week]||'')?0:1,theme:s0?(s0[MS.theme]||'royal'):'royal',sug:s0?s0[MS.sug]!==false:true};
 if(!['day','week','month'].includes(S.set.view))S.set.view='day';
 const srcOf=d=>/^Imported from Canvas/.test(d)?'canvas':/^Imported from Workday/.test(d)?'workday':/^Imported from Other/.test(d)?'other':undefined;
 S.items=[...ts.map(r=>({id:'t'+r[MT.id],rid:r[MT.id],kind:'task',title:r[MT.title],date:dd(r[MT.date]),time:'',end:'',loc:'',type:ty(r[MT.type]),pri:+r[MT.pri]||2,desc:r[MT.desc]||'',done:!!done[r[MT.id]],src:srcOf(r[MT.desc]||'')})),
  ...es.map(r=>({id:'e'+r[ME.id],rid:r[ME.id],kind:'event',title:r[ME.title],date:dd(r[ME.date])||dd(r[ME.start]),time:tt(r[ME.start]),end:tt(r[ME.end]),loc:r[ME.loc]||'',type:ty(r[ME.type]),pri:+r[ME.pri]||2,desc:r[ME.desc]||'',done:false,src:srcOf(r[ME.desc]||'')}))].filter(i=>i.date);
 S.interests=ints.map(r=>r[MI.val])}
function startDemo(){DEMO=true;S=init();S.user='Demo';S.stay=false;S.prof.name='Demo User';S.interests=['career','ai'];seed();D=TODAY;toast('Demo mode: nothing is saved');go('summary')}
async function startSession(id,name){S.uid=id;S.user=name;try{await loadSB()}catch(e){fail(e)}}
async function logout(){if(DEMO){location.hash='#login';location.reload();return}if(useSB){localStorage.removeItem('sch_login');sessionStorage.removeItem('sch_login');S=init()}else{S.user=null;S.stay=false;save()}PE=false;go('login')}
/* ===================================================================== */
const on=d=>S.items.filter(i=>i.date===d);
const byT=(a,b)=>mins(a.time)-mins(b.time),byP=(a,b)=>a.pri-b.pri;
const tasks=d=>on(d).filter(i=>i.kind==='task').sort(byP),evs=d=>on(d).filter(i=>i.kind==='event').sort(byT);

function link(k){if(S.linked[k]){S.linked[k]=false;S.items.filter(i=>i.src==k).forEach(dbDel);S.items=S.items.filter(i=>i.src!=k);dbLink(k,false);toast('Unlinked');}else{S.linked[k]=true;const m=(o)=>{const it={id:uid(),desc:'Imported from '+({canvas:'Canvas',workday:'Workday',other:'Other calendar'}[k]),loc:'',time:'',end:'',done:false,src:k,...o};S.items.push(it);dbItem(it)};
if(k=='canvas'){m({kind:'task',title:'IS 402 Homework',date:ad(TODAY,1),type:'school',pri:1});m({kind:'task',title:'IS 401 Discussion Post',date:ad(TODAY,3),type:'school',pri:2})}
if(k=='workday'){m({kind:'event',title:'Work Shift',date:ad(TODAY,2),time:'13:00',end:'17:00',type:'work',pri:2,loc:'Campus'})}
if(k=='other'){m({kind:'event',title:'Dentist',date:ad(TODAY,4),time:'10:00',end:'11:00',type:'personal',pri:2,loc:'Provo'})}
toast('Linked: imported items added');dbLink(k,true)}save();r()}
function r(){let h=(location.hash||'#login').slice(1);if(!S.user)h='login';if(h=='login'&&S.user)h='summary';
const f={login,summary,day,week,month,todo,add:addf,discovery:disc,settings:sett,profile:prof}[h]||summary;
document.documentElement.dataset.theme=S.set.theme;$('#app').dataset.page=h;$('#app').innerHTML=f()}
addEventListener('hashchange',r);
(async function boot(){
$('#app').innerHTML='<div class="main login"><p style="text-align:center;color:var(--mut)">Loading…</p></div>';
if(useSB){try{await resolveSchema();if(!DBERR.length){const raw=localStorage.getItem('sch_login')||sessionStorage.getItem('sch_login');if(raw){const a=JSON.parse(raw);await startSession(a.id,a.name)}}}catch(e){DBERR=['Could not reach Supabase: '+nice(e)]}}
if(!S.user&&location.hash!=='#login')history.replaceState(null,'','#login');
r()})();
</script>
