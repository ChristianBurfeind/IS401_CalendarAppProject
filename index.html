<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>The Daily Blend</title>
    <style>
      :root {
        box-sizing: border-box;
        --bg: #eef1f6;
        --card: #fff;
        --ink: #14213d;
        --mut: #5d6b82;
        --pri: #002e5d;
        --on: #fff;
        --acc: #e8eef8;
        --line: #d5dbe6;
        --urg: #c62828;
        --std: #d98200;
        --flx: #2e7d32;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      [data-theme="dark"] {
        --bg: #0d1320;
        --card: #182236;
        --ink: #eaf0fb;
        --mut: #9aa8c2;
        --pri: #6fa3ef;
        --on: #0d1320;
        --acc: #223250;
        --line: #2c3b58;
      }
      [data-theme="forest"] {
        --pri: #1b5e3a;
        --acc: #e3f1e8;
        --bg: #eef3ef;
      }
      [data-theme="plum"] {
        --pri: #6a1b6e;
        --acc: #f1e5f2;
        --bg: #f4eef5;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--card);
        color: var(--ink);
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      #app {
        display: grid;
        grid-template-columns: 230px 1fr;
        grid-template-rows: auto 1fr;
        grid-template-areas: "top top" "nav main";
        height: 100vh;
        background: var(--card);
      }
      .top {
        grid-area: top;
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        padding: 12px 24px;
        border-bottom: 1px solid var(--line);
      }
      .top h1 {
        margin: 0;
        font-size: 22px;
        text-align: center;
      }
      .ic {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--acc);
        color: var(--pri);
        font-size: 16px;
        font-weight: 700;
        border: 0;
        cursor: pointer;
        overflow: hidden;
      }
      .ic img,
      .av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .main {
        grid-area: main;
        overflow: auto;
        min-height: 0;
        padding: 24px 24px 100px;
        padding-inline: max(24px, calc((100% - 1200px) / 2));
      }
      #app[data-page="add"] .main,
      #app[data-page="settings"] .main,
      #app[data-page="profile"] .main {
        padding-inline: max(24px, calc((100% - 640px) / 2));
      }
      #app[data-page="todo"] .main,
      #app[data-page="discovery"] .main,
      #app[data-page="summary"] .main {
        padding-inline: max(24px, calc((100% - 820px) / 2));
      }
      #app .login {
        grid-column: 1/-1;
        grid-row: 1/-1;
        width: 100%;
        max-width: 420px;
        margin: auto;
        padding: 24px;
        overflow: visible;
      }
      .nav {
        grid-area: nav;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 12px;
        border-right: 1px solid var(--line);
      }
      .nav a {
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 15px;
        color: var(--mut);
        font-weight: 600;
      }
      .nav a:hover {
        background: var(--bg);
      }
      .nav a.on {
        color: var(--pri);
        background: var(--acc);
      }
      .fab {
        position: fixed;
        right: 32px;
        bottom: 28px;
        height: 52px;
        padding: 0 24px;
        border: 0;
        border-radius: 99px;
        background: var(--pri);
        color: var(--on);
        font: 600 16px system-ui;
        cursor: pointer;
        box-shadow: 0 4px 12px #0004;
      }
      .seg {
        max-width: 360px;
        display: flex;
        background: var(--acc);
        border-radius: 10px;
        padding: 3px;
        margin: 2px 0 8px;
      }
      .seg a {
        flex: 1;
        text-align: center;
        padding: 6px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        color: var(--mut);
      }
      .seg a.on {
        background: var(--pri);
        color: var(--on);
      }
      .btn {
        display: block;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--pri);
        color: var(--on);
        font: 600 15px system-ui;
        text-align: center;
        margin-top: 10px;
        cursor: pointer;
      }
      .btn.alt {
        background: var(--acc);
        color: var(--pri);
      }
      .btn.del {
        background: var(--urg);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: var(--mut);
        margin: 10px 0 3px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex: none;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mut);
        margin: 14px 0 6px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 9px 12px;
        background: var(--bg);
        border-radius: 12px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      .row .t {
        flex: 1;
        min-width: 0;
      }
      .row small {
        display: block;
        color: var(--mut);
      }
      .done .t {
        text-decoration: line-through;
        opacity: 0.5;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .p1 {
        color: var(--urg);
      }
      .p2 {
        color: var(--std);
      }
      .p3 {
        color: var(--flx);
      }
      .nav2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .nav2 button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: var(--acc);
        color: var(--pri);
        font-size: 18px;
        cursor: pointer;
      }
      .add {
        padding: 5px 12px;
        border: 0;
        border-radius: 99px;
        background: var(--pri);
        color: var(--on);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .add:disabled {
        opacity: 0.5;
      }
      .dg {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 24px;
      }
      .grid {
        position: relative;
        height: 816px;
      }
      .grid i {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px solid var(--line);
        font: normal 10px system-ui;
        color: var(--mut);
        height: 48px;
      }
      .ev {
        font-size: 14px;
        position: absolute;
        left: 54px;
        right: 2px;
        padding: 3px 7px;
        border-radius: 8px;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        cursor: pointer;
      }
      .sug {
        position: absolute;
        left: 54px;
        right: 2px;
        height: 44px;
        padding: 4px 7px;
        border: 1.5px dashed var(--pri);
        border-radius: 8px;
        font-size: 11px;
        color: var(--pri);
        background: var(--card);
      }
      .sug button {
        float: right;
        margin-top: -2px;
      }
      .wk {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        font-size: 13px;
      }
      .wk > div {
        background: var(--bg);
        border-radius: 8px;
        min-height: 480px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .wk > div > b {
        text-align: center;
        font-size: 14px;
        cursor: pointer;
      }
      .wk .td {
        outline: 2px solid var(--pri);
      }
      .wk span {
        border-radius: 6px;
        padding: 4px 6px;
        overflow: hidden;
        cursor: pointer;
        color: #fff;
        font-weight: 600;
        word-break: break-word;
      }
      .wk hr {
        width: 100%;
        border: 0;
        border-top: 1px solid var(--line);
        margin: 1px 0;
      }
      .mo {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        text-align: center;
      }
      .mo > b {
        font-size: 11px;
        color: var(--mut);
      }
      .mo > div {
        min-height: 104px;
        background: var(--bg);
        border-radius: 10px;
        padding: 6px;
        font-size: 14px;
        font-weight: 600;
        overflow: hidden;
        cursor: pointer;
      }
      .mo .td {
        outline: 2px solid var(--pri);
      }
      .mo .x {
        opacity: 0.4;
      }
      .mo u {
        display: block;
        text-decoration: none;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        text-align: left;
        padding: 2px 6px;
        border-radius: 5px;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sw {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .sw select {
        width: 120px;
      }
      .tog {
        width: 46px;
        height: 26px;
        border-radius: 99px;
        background: var(--line);
        position: relative;
        border: 0;
        cursor: pointer;
        flex: none;
      }
      .tog::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: 0.15s;
      }
      .tog.on {
        background: var(--pri);
      }
      .tog.on::after {
        left: 23px;
      }
      .av {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--acc);
        display: grid;
        place-items: center;
        font-size: 36px;
        color: var(--pri);
        margin: 6px auto;
        overflow: hidden;
        font-weight: 700;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .kv span {
        color: var(--mut);
        font-weight: 600;
      }
      .chips {
        max-width: 420px;
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      .chips button {
        flex: 1;
        padding: 7px 2px;
        border: 0;
        border-radius: 10px;
        background: var(--acc);
        color: var(--pri);
        font: 600 12px system-ui;
        cursor: pointer;
      }
      .chips .on {
        background: var(--pri);
        color: var(--on);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #0007;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
      }
      .sheet {
        background: var(--card);
        width: 100%;
        max-width: 480px;
        border-radius: 18px;
        padding: 18px 20px 22px;
        box-shadow: 0 20px 50px #0005;
      }
      .sheet header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sheet h3 {
        margin: 0;
      }
      .rem {
        background: var(--acc);
        border-radius: 12px;
        padding: 8px 12px;
        margin-bottom: 6px;
        color: var(--pri);
        font-size: 13px;
        font-weight: 600;
      }
      .err {
        color: var(--urg);
        font-size: 13px;
        min-height: 18px;
        margin-top: 6px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        background: #1b2433;
        color: #fff;
        padding: 8px 14px;
        border-radius: 99px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 99;
        white-space: nowrap;
      }
      @media (max-width: 760px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-areas: "top" "main" "nav";
        }
        .nav {
          flex-direction: row;
          border-right: 0;
          border-top: 1px solid var(--line);
          padding: 6px;
        }
        .nav a {
          flex: 1;
          text-align: center;
          padding: 10px 4px;
          font-size: 13px;
        }
        .fab {
          bottom: 76px;
          right: 16px;
        }
        .dg {
          grid-template-columns: 1fr;
        }
        .top {
          padding: 10px 12px;
        }
        .wk {
          font-size: 10px;
          gap: 3px;
        }
        .wk > div {
          padding: 3px;
          min-height: 340px;
        }
        .mo > div {
          min-height: 60px;
          font-size: 12px;
        }
        .mo u {
          height: 5px;
          font-size: 0;
          padding: 0;
        }
      }
      #toast.s {
        opacity: 1;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        color: var(--ink);
        padding: 24px;
        width: min(440px, 92vw);
        max-height: 90vh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #0008;
      }
      .avatar-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .avatar-grid button {
        font-size: 30px;
        border: 2px solid transparent;
        border-radius: 12px;
        background: var(--acc);
        padding: 10px;
        cursor: pointer;
      }
      .avatar-grid button[aria-pressed="true"] {
        border-color: var(--pri);
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #d98200;
        outline-offset: 3px;
      }

      /* Account screens use the full grid width, without an empty nav column. */
      #app[data-page="profile"] .main {
        grid-column: 1 / -1;
      }
      .profile-photo-button {
        position: relative;
        padding: 0;
        border: 0;
        cursor: pointer;
      }
      .profile-photo-button .photo-edit-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(0 46 93 / 45%);
        color: white;
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      .profile-photo-button:hover .photo-edit-overlay,
      .profile-photo-button:focus-visible .photo-edit-overlay {
        opacity: 1;
      }
      .photo-edit-overlay svg {
        width: 30px;
        height: 30px;
      }
      .photo-hint {
        text-align: center;
        color: var(--mut);
        font-size: 12px;
        margin: 8px 0 20px;
      }
      @media (hover: none) {
        .profile-photo-button .photo-edit-overlay {
          opacity: 1;
          inset: auto 0 0;
          height: 27px;
        }
        .photo-edit-overlay svg {
          width: 19px;
          height: 19px;
        }
      }
      #app[data-page="confirm-email"] {
        min-height: 100dvh;
        height: auto;
        background: radial-gradient(
          ellipse at top,
          var(--acc),
          var(--card) 70%
        );
      }
      #app[data-page="confirm-email"] .login {
        max-width: 500px;
        text-align: center;
        padding: 48px 24px;
      }
      .welcome-icon {
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        border-radius: 28px;
        background: var(--acc);
        font-size: 46px;
        transform: rotate(-6deg);
      }
      .welcome-kicker {
        color: var(--pri);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 12px;
      }
      .welcome-copy {
        color: var(--mut);
        line-height: 1.7;
      }
      .welcome-email {
        display: block;
        color: var(--ink);
        overflow-wrap: anywhere;
        margin: 12px 0;
      }
      .welcome-note {
        background: var(--acc);
        padding: 16px;
        border-radius: 14px;
        font-size: 14px;
        margin: 24px 0;
      }
      #picture-dialog {
        width: min(480px, 94vw);
      }
      #picture-dialog h2 {
        margin-top: 0;
      }
      .crop-stage {
        width: min(280px, 100%);
        margin: 12px auto;
      }
      #crop-canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--acc);
        touch-action: none;
        cursor: grab;
        outline: 2px solid var(--line);
        outline-offset: 3px;
      }
      #crop-canvas:active {
        cursor: grabbing;
      }
      .crop-controls label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
      }
      .crop-controls input[type="range"] {
        width: 100%;
        padding: 0;
        accent-color: var(--pri);
      }
      .crop-help {
        color: var(--mut);
        font-size: 12px;
        text-align: center;
      }
      #picture-dialog [hidden] {
        display: none !important;
      }
      .picture-drop-zone {
        border: 2px dashed var(--line);
        border-radius: 16px;
        padding: 20px 16px;
        margin-top: 20px;
        text-align: center;
        background: var(--bg);
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .picture-drop-zone.is-dragging {
        border-color: var(--pri);
        background: var(--acc);
      }
      .picture-drop-zone p {
        margin: 4px 0 10px;
      }
      .picture-drop-zone small {
        display: block;
        color: var(--mut);
        margin-top: 10px;
      }
      .picture-drop-zone .btn {
        margin: 8px auto 0;
      }
      .profile-field-value {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
      }
      .profile-field-value b {
        overflow-wrap: anywhere;
        text-align: right;
      }
      .field-pencil {
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        font-size: 16px;
      }
      .profile-edit-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .account-danger {
        border-top: 1px solid var(--line);
        margin-top: 28px;
        padding-top: 18px;
      }
      .account-danger h2 {
        color: #b42318;
        margin: 0 0 8px;
        font-size: 16px;
      }
      .account-danger p {
        color: var(--mut);
        font-size: 13px;
      }
      .delete-account-button {
        color: #b42318;
        background: var(--card);
        border: 1px solid #b42318;
      }
      #delete-dialog {
        width: min(440px, 92vw);
      }
      #delete-dialog h2 {
        color: #b42318;
      }
      #delete-dialog p {
        line-height: 1.6;
      }
      .btn:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .profile-connections {
        margin: 24px 0 18px;
      }
      .profile-connections h2 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .connection-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .connection-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 0;
        padding: 18px 8px 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .connection-card:not(:disabled):hover {
        border-color: var(--pri);
        background: var(--bg);
      }
      .connection-card.is-linked {
        border-color: var(--pri);
        background: var(--acc);
      }
      .connection-icon {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        padding: 9px;
        border-radius: 14px;
        background: #fff;
        color: #002e5d;
      }
      .connection-icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .connection-name {
        display: grid;
        place-items: center;
        min-height: 2.5em;
        font-size: 13px;
        font-weight: 650;
        text-align: center;
        line-height: 1.25;
      }
      .connection-action {
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        color: var(--pri);
      }
      .connection-note {
        color: var(--mut);
        font-size: 12px;
        line-height: 1.5;
        margin: 12px 0 0;
      }
      @media (max-width: 430px) {
        .connection-grid {
          gap: 7px;
        }
        .connection-card {
          padding: 12px 3px;
          gap: 8px;
          border-radius: 12px;
        }

      const CONNECTIONS = [
        ["canvas", "Canvas"],
        ["learningSuite", "Learning Suite"],
        ["workday", "Workday"],
        ["other", "Other Calendar"],
      ];
      function profileConnections() {
        // UI placeholders only. Enable each button and attach its connection flow
        // when the assigned integration is ready. data-connection identifies it.
        return `<section class="profile-connections" aria-labelledby="connections-heading">
          <h2 id="connections-heading">Connect accounts</h2>
          <div class="connection-grid">${CONNECTIONS.map(
            ([key, name]) => `
            <button type="button" class="connection-card" data-connection="${key}" disabled aria-label="${name} connection — coming soon">
              <span class="connection-icon">${CONNECTION_ICONS[key]}</span>
              <span class="connection-name">${name}</span>
              <span class="connection-action">Coming soon</span>
            </button>`,
          ).join("")}</div>
        </section>`;
      }
      function prof() {
        const p = S.prof;
        const fields = PROFILE_FIELDS.map(([field, label]) => {
          if (field === "interests") return PE ? "" : interestsSection();
          if (field === "age") {
            if (PE) return "";
            const a = ageFromBirthDate(p.birthDate) ?? p.age;
            return `<div class="kv"><span>${label}</span><b>${esc(a) || "—"}</b></div>`;
          }
          const value =
            field === "interests" ? S.interests.join(", ") : p[field];
          return PE
            ? `<label for="p-${field}">${label}${field === "interests" ? " (comma-separated)" : ""}</label>
            ${field === "birthDate" ? birthPicker("p-birthDate", value, "updateAgePreview()") : field === "gender" ? `<select id="p-gender"><option value="">Select…</option>${["Female", "Male"].map((g) => `<option ${value === g ? "selected" : ""}>${g}</option>`).join("")}</select>` : `<input id="p-${field}" type="text" value="${esc(value)}">`}${field === "birthDate" ? `<small id="profile-age-preview" class="profile-age-hint">${esc(ageDescription(value))}</small><small class="profile-age-hint">Optional. Used to calculate your age and celebrate your birthday.</small>` : ""}`
            : `<div class="kv"><span>${label}</span><div class="profile-field-value"><b>${field === "birthDate" ? birthDateDisplay(value) : esc(value) || "—"}</b>${fieldPencil(field, label)}</div></div>`;
        }).join("");
        const body = `${profilePictureButton()}<p class="photo-hint">Click your picture to change it</p>
          ${PE ? `<form onsubmit="event.preventDefault();saveP()">${fields}<p id="profile-error" class="err" role="status" aria-live="polite"></p><button id="save-profile" class="btn" type="submit">Save changes</button><button class="btn alt" type="button" onclick="PE=false;r()">Cancel</button></form>` : fields}
          ${!PE ? `${profileConnections()}<button class="btn alt" onclick="logout()">Log out</button>` : ""}
          <section class="account-danger"><h2>Delete account</h2><p>Permanently remove your account, profile, tasks, events, settings, and uploaded profile pictures.</p><button type="button" class="btn delete-account-button" onclick="openDeleteAccount()">Delete my account</button></section>`;
        return shell("Profile", body, {
          left: '<button class="ic" onclick="PE=false;go(S.set.view)" aria-label="Back">‹</button>',
          right: "<span></span>",
        });
      }
      let deleteBusy = false,
        deleteStep = 0;
      function openDeleteAccount() {
        if ($("#delete-dialog")) return;
        const d = document.createElement("dialog");
        d.id = "delete-dialog";
        d.setAttribute("aria-labelledby", "delete-title");
        d.addEventListener("cancel", (e) => {
          e.preventDefault();
          closeDeleteAccount();
        });
        document.body.append(d);
        deleteStep = 1;
        renderDeleteConfirmation();
        d.showModal();
        $("#delete-cancel").focus();
      }
      function renderDeleteConfirmation() {
        const final = deleteStep === 2;
        $("#delete-dialog").innerHTML =
          `<h2 id="delete-title">${final ? "Are you absolutely sure?" : "Delete your account?"}</h2>
          <p>${final ? "This is the final confirmation. Your account and saved data will be permanently deleted. This cannot be undone." : "Deleting your account removes your profile, tasks, events, settings, and uploaded profile pictures. Would you like to continue?"}</p>
          ${DEMO ? "<p>You are in demo mode. Only this temporary demo will be cleared.</p>" : ""}
          <p id="delete-error" class="err" role="alert"></p>
          <button type="button" id="delete-continue" class="btn del" onclick="${final ? "deleteAccount()" : "nextDeleteConfirmation()"}">${final ? "Yes, permanently delete my account" : "Continue to final confirmation"}</button>
          <button type="button" id="delete-cancel" class="btn alt" onclick="closeDeleteAccount()">${final ? "Keep my account" : "Cancel"}</button>`;
      }
      function nextDeleteConfirmation() {
        if (deleteBusy) return;
        deleteStep = 2;
        renderDeleteConfirmation();
        $("#delete-cancel").focus();
      }
      function closeDeleteAccount() {
        if (deleteBusy) return;
        $("#delete-dialog")?.remove();
        deleteStep = 0;
      }
      async function deleteAccount() {
        if (deleteBusy || deleteStep !== 2 || !$("#delete-dialog")) return;
        deleteBusy = true;
        $("#delete-continue").disabled = true;
        $("#delete-cancel").disabled = true;
        $("#delete-error").textContent = "Deleting your account…";
        const owner = S.uid;
        try {
          if (!DEMO) {
            if (!live())
              throw new Error(
                "Live account deletion requires a Supabase connection.",
              );
            const { data: session, error: sessionError } =
              await sb.auth.getSession();
            if (sessionError) throw sessionError;
            if (!session.session)
              throw new Error(
                "Your session expired. Log in again before deleting your account.",
              );
            const { data, error } = await sb.functions.invoke(
              "delete-account",
              {
                body: { confirmation: "DELETE_MY_ACCOUNT" },
                headers: {
                  Authorization: "Bearer " + session.session.access_token,
                },
              },
            );
            if (error) {
              let message =
                "Account deletion failed. Please try again. If this keeps happening, contact your project administrator.";
              try {
                if (error.context) {
                  const detail = await error.context.json();
                  if (detail.error) message = detail.error;
                }
              } catch {}
              throw new Error(message);
            }
            if (!data?.deleted)
              throw new Error("Deletion was not confirmed. Please try again.");
            // The server confirmed deletion before we clear anything in this browser.
            try {
              await sb.auth.signOut({ scope: "local" });
            } catch {}
          }
          for (const storage of [localStorage, sessionStorage]) {
            storage.removeItem("sch_login");
            storage.removeItem("scheduler_pending_email");
            for (const prefix of ["sch_photo_", "sch_linked_", "sch_notif_"])
              if (owner) storage.removeItem(prefix + owner);
          }
          authStore.removeItem("scheduler_auth_v3");
          pendingEmail = "";
          savedPictureSource = null;
          DEMO = false;
          S = init();
          PE = false;
          deleteBusy = false;
          closeDeleteAccount();
          go("login");
          r();
          toast("Your account has been deleted.");
        } catch (e) {
          deleteBusy = false;
          const er = $("#delete-error");
          if (er) er.textContent = nice(e);
          if ($("#delete-continue")) $("#delete-continue").disabled = false;
          if ($("#delete-cancel")) $("#delete-cancel").disabled = false;
        }
      }
      async function saveP() {
        const np = {};
        ["name", "school", "work", "major", "birthDate", "gender"].forEach(
          (k) => (np[k] = $("#p-" + k).value.trim()),
        );
        np.name = np.name || S.prof.name;
        if (np.birthDate && ageFromBirthDate(np.birthDate) === null) {
          $("#profile-error").textContent =
            "Choose a valid date of birth that is not in the future.";
          return;
        }
        const ints = S.interests;
        const button = $("#save-profile");
        if (button?.disabled) return;
        if (button) button.disabled = true;
        if (!(await dbProfile(np, ints))) {
          if (button) button.disabled = false;
          return;
        }
        S.prof = np;
        S.interests = ints;
        PE = false;
        save();
        toast("Profile saved");
        r();
      }
      const AVATARS = [
        ["music", "🎵", "Music"],
        ["nature", "🌲", "Nature"],
        ["basketball", "🏀", "Basketball"],
        ["soccer", "⚽", "Soccer"],
        ["art", "🎨", "Art"],
        ["fox", "🦊", "Fox"],
        ["cat", "🐱", "Cat"],
        ["gaming", "🎮", "Gaming"],
        ["books", "📚", "Reading"],
        ["mountain", "🏔️", "Outdoors"],
        ["science", "🔬", "Science"],
        ["space", "🚀", "Space"],
        ["theater", "🎭", "Theater"],
        ["cooking", "🍳", "Cooking"],
        ["travel", "🌎", "Travel"],
        ["flowers", "🌻", "Flowers"],
      ];
      function avatarImage(id) {
        const a = AVATARS.find((x) => x[0] === id);
        return a
          ? "data:image/svg+xml;charset=utf-8," +
              encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="80" fill="#e8eef8"/><text x="80" y="110" text-anchor="middle" font-size="92">${a[1]}</text></svg>`,
              )
          : "";
      }
      // Keep the source in memory while this page is open, so a saved crop can be adjusted again.
      let pictureDraft = null,
        pictureBusy = false,
        pictureVersion = 0;
      let cropState = null,
        savedPictureSource = null;
      function openPicture() {
        if ($("#picture-dialog")) return;
        pictureDraft = {
          photo: S.photo,
          path: S.photoPath,
          avatar: S.avatar,
          blob: null,
        };
        cropState = null;
        const d = document.createElement("dialog");
        d.id = "picture-dialog";
        d.setAttribute("aria-labelledby", "picture-title");
        d.innerHTML = `<h2 id="picture-title">Make it yours</h2>
          <div id="picture-preview" class="av"></div>
          <div id="crop-editor" hidden>
            <div class="crop-stage"><canvas id="crop-canvas" width="320" height="320" aria-label="Photo crop preview"></canvas></div>
            <p class="crop-help">Drag to center your face, or use the sliders below.<br>The circle shows how your profile picture will look.</p>
            <div class="crop-controls">
              <label for="crop-zoom">Zoom</label><input id="crop-zoom" type="range" min="1" max="6" step="0.01" value="1" oninput="changeCrop('zoom',this.value)">
              <label for="crop-x">Horizontal position</label><input id="crop-x" type="range" min="0" max="100" step="0.1" value="50" oninput="changeCrop('x',this.value)">
              <label for="crop-y">Vertical position</label><input id="crop-y" type="range" min="0" max="100" step="0.1" value="50" oninput="changeCrop('y',this.value)">
              <button class="btn alt" type="button" onclick="resetCrop()">Reset crop</button>
            </div>
          </div>
          <div id="picture-drop-zone" class="picture-drop-zone" role="group" aria-label="Upload a profile picture">
            <p><strong>Drag and drop your picture here</strong></p>
            <button class="btn alt" type="button" onclick="$('#picture-file').click()">Or choose a file</button>
            <small>One JPEG, PNG or WebP image, up to 5 MB</small>
            <input id="picture-file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Choose profile picture" hidden onchange="photo(this)">
          </div>
          <p class="crop-help">To recover areas cropped out of a previously saved photo, upload the original again.</p>
          <p>Or choose an avatar</p><div class="avatar-grid">${AVATARS.map(([id, emoji, name]) => `<button type="button" data-avatar="${id}" aria-label="${name}" onclick="pickAvatar('${id}')">${emoji}</button>`).join("")}</div>
          <button class="btn alt" type="button" onclick="pickAvatar('')">Remove picture</button>
          <p id="picture-error" role="status" aria-live="polite"></p>
          <button class="btn" type="button" onclick="savePicture()">Save picture</button>
          <button class="btn alt" type="button" onclick="closePicture()">Cancel</button>`;
        d.addEventListener("cancel", (e) => {
          e.preventDefault();
          closePicture();
        });
        document.body.append(d);
        d.showModal();
        previewPicture();
        bindCropDrag();
        bindPictureDrop();
        if (S.photo && !S.avatar) {
          if (savedPictureSource && savedPictureSource.photo === S.photo) {
            setupCrop(savedPictureSource.image, savedPictureSource.crop);
          } else loadCropImage(S.photo, false);
        }
      }
      function previewPicture() {
        $("#picture-preview").hidden = !!cropState;
        $("#crop-editor").hidden = !cropState;
        $("#picture-preview").innerHTML = pictureDraft.photo
          ? `<img src="${esc(pictureDraft.photo)}" alt="Picture preview">`
          : "👤";
        document
          .querySelectorAll("[data-avatar]")
          .forEach((b) =>
            b.setAttribute(
              "aria-pressed",
              String(b.dataset.avatar === pictureDraft.avatar),
            ),
          );
      }
      function closePicture() {
        if (pictureBusy) return;
        pictureVersion++;
        $("#picture-dialog")?.remove();
        pictureDraft = null;
        cropState = null;
      }
      function pickAvatar(id) {
        if (pictureBusy) return;
        pictureVersion++;
        cropState = null;
        pictureDraft = {
          photo: avatarImage(id),
          path: "",
          avatar: id,
          blob: null,
        };
        $("#picture-error").textContent = "";
        previewPicture();
      }
      // crop geometry is in original image pixels; no blank margins can enter the crop.
      function cropGeometry(state) {
        const size =
          Math.min(state.image.naturalWidth, state.image.naturalHeight) /
          state.zoom;
        const half = size / 2;
        state.cx = Math.max(
          half,
          Math.min(state.image.naturalWidth - half, state.cx),
        );
        state.cy = Math.max(
          half,
          Math.min(state.image.naturalHeight - half, state.cy),
        );
        return { x: state.cx - half, y: state.cy - half, size };
      }
      function setupCrop(image, previous) {
        cropState = {
          image,
          zoom: previous?.zoom || 1,
          cx: previous?.cx ?? image.naturalWidth / 2,
          cy: previous?.cy ?? image.naturalHeight / 2,
        };
        pictureDraft.avatar = "";
        previewPicture();
        renderCrop();
      }
      function renderCrop() {
        if (!cropState) return;
        const c = $("#crop-canvas"),
          g = cropGeometry(cropState),
          ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(
          cropState.image,
          g.x,
          g.y,
          g.size,
          g.size,
          0,
          0,
          c.width,
          c.height,
        );
        $("#crop-zoom").value = cropState.zoom;
        const spanX = cropState.image.naturalWidth - g.size,
          spanY = cropState.image.naturalHeight - g.size;
        $("#crop-x").value = spanX ? (g.x / spanX) * 100 : 50;
        $("#crop-y").value = spanY ? (g.y / spanY) * 100 : 50;
        $("#crop-x").disabled = !spanX;
        $("#crop-y").disabled = !spanY;
      }
      function changeCrop(axis, value) {
        if (!cropState || pictureBusy) return;
        if (axis === "zoom") cropState.zoom = Number(value);
        else {
          const g = cropGeometry(cropState),
            dim = axis === "x" ? "naturalWidth" : "naturalHeight";
          cropState[axis === "x" ? "cx" : "cy"] =
            g.size / 2 +
            ((cropState.image[dim] - g.size) * Number(value)) / 100;
        }
        renderCrop();
      }
      function resetCrop() {
        if (!cropState || pictureBusy) return;
        setupCrop(cropState.image);
      }
      function bindCropDrag() {
        const c = $("#crop-canvas");
        let drag = null;
        c.addEventListener("pointerdown", (e) => {
          if (!cropState || pictureBusy) return;
          e.preventDefault();
          drag = {
            x: e.clientX,
            y: e.clientY,
            cx: cropState.cx,
            cy: cropState.cy,
          };
          c.setPointerCapture(e.pointerId);
        });
        c.addEventListener("pointermove", (e) => {
          if (!drag || !cropState || pictureBusy) return;
          const scale =
            cropGeometry(cropState).size / c.getBoundingClientRect().width;
          cropState.cx = drag.cx - (e.clientX - drag.x) * scale;
          cropState.cy = drag.cy - (e.clientY - drag.y) * scale;
          renderCrop();
        });
        const stop = () => {
          drag = null;
        };
        c.addEventListener("pointerup", stop);
        c.addEventListener("pointercancel", stop);
        c.addEventListener("lostpointercapture", stop);
      }
      // Browse and drag-and-drop share validation, cropping, and the same storage upload.
      function photo(inp) {
        acceptPictureFiles(inp.files);
        inp.value = "";
      }
      function acceptPictureFiles(files) {
        if (pictureBusy || !pictureDraft || !files.length) return;
        const er = $("#picture-error");
        if (files.length !== 1) {
          er.textContent = "Please choose one picture at a time.";
          return;
        }
        const f = files[0];
        if (
          !["image/jpeg", "image/png", "image/webp"].includes(f.type) ||
          f.size > 5 * 1024 * 1024
        ) {
          er.textContent =
            "Choose a JPEG, PNG or WebP image no larger than 5 MB.";
          return;
        }
        loadCropImage(URL.createObjectURL(f), true);
      }
      function bindPictureDrop() {
        const zone = $("#picture-drop-zone"),
          dialog = $("#picture-dialog");
        let depth = 0;
        const reset = () => {
          depth = 0;
          zone.classList.remove("is-dragging");
        };
        zone.addEventListener("dragenter", (e) => {
          e.preventDefault();
          if (!pictureBusy) {
            depth++;
            zone.classList.add("is-dragging");
          }
        });
        zone.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (e.dataTransfer)
            e.dataTransfer.dropEffect = pictureBusy ? "none" : "copy";
        });
        zone.addEventListener("dragleave", () => {
          depth = Math.max(0, depth - 1);
          if (!depth) reset();
        });
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          e.stopPropagation();
          reset();
          if (pictureBusy) return;
          const files = e.dataTransfer?.files;
          if (!files?.length) {
            $("#picture-error").textContent =
              "Drop an image file from your computer, or choose a file.";
            return;
          }
          acceptPictureFiles(files);
        });
        // Prevent a missed drop from navigating away and discarding the current edit.
        dialog.addEventListener("dragover", (e) => e.preventDefault());
        dialog.addEventListener("drop", (e) => {
          e.preventDefault();
          reset();
          if (!pictureBusy)
            $("#picture-error").textContent =
              "Drop your picture inside the dashed upload area.";
        });
      }
      function loadCropImage(src, revoke) {
        const version = ++pictureVersion,
          owner = S.uid;
        pictureBusy = true;
        pictureControls(true);
        $("#picture-error").textContent = "Opening your picture…";
        const im = new Image();
        im.crossOrigin = "anonymous";
        const done = () => {
          if (revoke) URL.revokeObjectURL(src);
          if (version !== pictureVersion || owner !== S.uid || !pictureDraft)
            return false;
          pictureBusy = false;
          pictureControls(false);
          return true;
        };
        im.onerror = () => {
          if (done())
            $("#picture-error").textContent =
              "This picture could not be opened. Try uploading the original image again.";
        };
        im.onload = () => {
          if (!done()) return;
          pictureDraft = { ...pictureDraft, avatar: "", blob: null };
          setupCrop(im);
          $("#picture-error").textContent = "";
        };
        im.src = src;
      }
      async function prepareCrop() {
        if (!cropState) return;
        const g = cropGeometry(cropState),
          c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, 256, 256);
        ctx.drawImage(
          cropState.image,
          g.x,
          g.y,
          g.size,
          g.size,
          0,
          0,
          256,
          256,
        );
        const blob = await new Promise((resolve, reject) =>
          c.toBlob(
            (b) =>
              b
                ? resolve(b)
                : reject(new Error("Could not prepare your picture.")),
            "image/jpeg",
            0.9,
          ),
        );
        pictureDraft = {
          photo: c.toDataURL("image/jpeg", 0.9),
          path: "",
          avatar: "",
          blob,
        };
      }
      function pictureControls(disabled) {
        document
          .querySelectorAll("#picture-dialog button,#picture-dialog input")
          .forEach((x) => (x.disabled = disabled));
      }
      async function savePicture() {
        if (pictureBusy) return;
        pictureBusy = true;
        pictureControls(true);
        const old = S.photoPath;
        let uploaded = "";
        try {
          await prepareCrop();
          let path = pictureDraft.path;
          if (live()) {
            if (pictureDraft.blob) {
              path = S.uid + "/" + uid() + ".jpg";
              await q(
                sb.storage
                  .from("profile-pictures")
                  .upload(path, pictureDraft.blob, {
                    contentType: "image/jpeg",
                    upsert: false,
                  }),
              );
              uploaded = path;
            }
            const U = M.users;
            const rows = await q(
              sb
                .from(U.t)
                .update({
                  [U.photo]: path || null,
                  [U.avatar]: pictureDraft.avatar || null,
                })
                .eq(U.id, S.uid)
                .select(qc(U.id)),
            );
            if (rows.length !== 1)
              throw new Error(
                "Profile update was not saved. Check your permissions.",
              );
          }
          S.photoPath = path;
          S.avatar = pictureDraft.avatar;
          S.photo = pictureDraft.photo;
          savedPictureSource = cropState
            ? {
                photo: S.photo,
                image: cropState.image,
                crop: {
                  zoom: cropState.zoom,
                  cx: cropState.cx,
                  cy: cropState.cy,
                },
              }
            : null;
          save();
          pictureBusy = false;
          closePicture();
          // Updating a picture must not erase text currently being edited in the profile form.
          if (PE && $(".profile-photo-button"))
            $(".profile-photo-button").outerHTML = profilePictureButton();
          else r();
          toast(DEMO ? "Picture changed for this demo" : "Picture saved");
          if (live() && old && old !== path) {
            const { error } = await sb.storage
              .from("profile-pictures")
              .remove([old]);
            if (error) console.warn("Old picture cleanup failed", error);
          }
        } catch (e) {
          if (uploaded)
            await sb.storage.from("profile-pictures").remove([uploaded]);
          pictureBusy = false;
          pictureControls(false);
          $("#picture-error").textContent = nice(e);
        }
      }
      function r() {
        let h = (location.hash || "#login").slice(1);
        if (!S.user && !(h === "confirm-email" && pendingEmail)) h = "login";
        if (h == "login" && S.user) h = "summary";
        const f =
          {
            login,
            "confirm-email": confirmEmail,
            summary,
            day,
            week,
            month,
            todo,
            add: addf,
            discovery: disc,
            settings: sett,
            profile: prof,
          }[h] || summary;
        document.documentElement.dataset.theme = S.set.theme;
        $("#app").dataset.page = h;
        $("#app").innerHTML = f();
        updateBirthdayUI();
      }
      addEventListener("hashchange", r);
      // Refresh the birthday/age at local midnight without discarding unsaved form text.
      setInterval(updateBirthdayUI, 60000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) updateBirthdayUI();
      });
      (async function boot() {
        $("#app").innerHTML =
          '<div class="main login"><p style="text-align:center;color:var(--mut)">Loading…</p></div>';
        if (useSB) {
          try {
            localStorage.removeItem("sch_login");
            sessionStorage.removeItem("sch_login");
            const { data, error } = await sb.auth.getSession();
            if (error) throw error;
            if (data.session) {
              await resolveSchema();
              if (DBERR.length) throw new Error(DBERR.join(" "));
              await startSession(data.session.user);
            }
          } catch (e) {
            S = init();
            DBERR = ["Could not load your account: " + nice(e)];
          }
          sb.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_OUT") {
              S = init();
              PE = false;
              pictureBusy = false;
              closePicture();
              r();
            }
          });
        }
        if (
          !S.user &&
          location.hash !== "#login" &&
          !(location.hash === "#confirm-email" && pendingEmail)
        )
          history.replaceState(null, "", "#login");
        r();
      })();
    </script>
  </body>
</html>
